<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Surat Room 💌</title>

<style>
body{
margin:0;
font-family:"Segoe UI", Arial;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background: radial-gradient(circle at center,#3b1f1a,#1a0f14,#0b0a10);
color:white;
overflow:hidden;
}

.room{
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
}

.card{
width:90%;
max-width:420px;
background:#1d1216;
border-radius:24px;
padding:28px;
text-align:center;
box-shadow:0 30px 80px rgba(0,0,0,0.65);
transform:scale(0.96);
opacity:0;
animation:enter 1.2s ease forwards;
}

@keyframes enter{
to{transform:scale(1);opacity:1;}
}

.title{
font-size:20px;
color:#ffd2c2;
margin-bottom:6px;
}

.sub{
font-size:12px;
opacity:0.75;
margin-bottom:18px;
color:#f3c6d2;
}

button{
padding:12px 22px;
border:none;
border-radius:999px;
cursor:pointer;
font-size:14px;
background:#ff6b86;
color:white;
transition:0.2s;
}

button:hover{
transform:scale(1.05);
}

button:disabled{
opacity:0.5;
cursor:not-allowed;
}

.letter{
margin-top:18px;
text-align:left;
white-space:pre-line;
line-height:1.7;
font-size:15px;
color:#ffe9e3;

opacity:0;
transform:translateY(10px);
transition:1s ease;
display:none;
}

.letter.show{
display:block;
opacity:1;
transform:translateY(0);
}

.small{
margin-top:12px;
font-size:12px;
opacity:0.7;
color:#f2d3da;
}

audio{display:none;}
</style>
</head>

<body>

<div class="room">
<div class="card">

<div class="title">💌 Surat Untuk Kamu</div>
<div class="sub">ada ruang kecil di sini</div>

<button onclick="openLetter()">Buka Surat</button>

<div id="letter" class="letter"></div>

<div class="small">dibaca tanpa terburu-buru</div>

</div>
</div>

<audio id="bgm" src="drop-dead.mp3" loop></audio>

<script>

const text = `Hai, kamu di sana

Aku nggak tahu kamu lagi di mana sekarang.

Tapi kalau kamu lagi di sini sebentar,
aku cuma mau kamu tahu satu hal:

kamu ninggalin kesan yang baik.
Aku senang pernah mengenalmu.

Semoga kamu selalu ditemani hal-hal yang baik.`;

function typeWriter(el, txt, i=0){
if(i === 0) el.innerHTML = "";
if(i < txt.length){
el.innerHTML += txt.charAt(i);
setTimeout(()=>typeWriter(el, txt, i+1), 55);
}
}

function fadeIn(audio){
audio.volume = 0;
audio.play();

let v = 0;
const fade = setInterval(()=>{
if(v < 0.35){
v += 0.02;
audio.volume = v;
}else{
clearInterval(fade);
}
}, 80);
}

let opened = false;

function openLetter(){
if(opened) return;
opened = true;

const letter = document.getElementById("letter");
const btn = document.querySelector("button");
const bgm = document.getElementById("bgm");

btn.disabled = true;
btn.innerText = "terbuka";

setTimeout(()=>{
letter.classList.add("show");
typeWriter(letter, text);
}, 1000);

setTimeout(()=>{
fadeIn(bgm);
}, 1600);
}

</script>

</body>
</html>
